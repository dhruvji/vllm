group: Cartridge
depends_on:
  - image-build
steps:
- label: Cartridge OpenAI Adapter Regression
  key: cartridge-openai-adapter-regression
  timeout_in_minutes: 30
  device: h200_18gb
  source_file_dependencies:
  - vllm/entrypoints/openai/
  - vllm/v1/cartridge_loader.py
  - tests/test_cartridge_addition_eval.py
  commands:
  - export VLLM_TEST_ENABLE_CARTRIDGE=1
  - export VLLM_PASSTHROUGH_ERRORS=1
  - pytest -v -s tests/test_cartridge_addition_eval.py::test_cartridge_not_found_returns_http_error -m benchmark
