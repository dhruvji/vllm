name: Cartridge Addition Eval (FlashInfer V1)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cartridge-eval-flashinfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GPU_TYPE: "H200"
      GPU_COUNT: "1"
      VLLM_PRECOMPILED_WHEEL_COMMIT: "2b465570e6dd327e8422ef9c87e9b2b1454ceaed"
      BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal CLI
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Run cartridge evaluation tests (FlashInfer + V1)
        run: |
          modal run --env=ci .github/scripts/modal_ci_pytest.py \
            --test-path tests/test_cartridge_addition_eval.py \
            --pytest-args "-v -x -m benchmark" \
            --env-vars "VLLM_TEST_ENABLE_CARTRIDGE=1,VLLM_PASSTHROUGH_ERRORS=1,VLLM_ATTENTION_BACKEND=FLASHINFER,VLLM_USE_V1=1"

      - name: Report results
        if: always()
        run: |
          echo "Cartridge evaluation (FlashInfer V1) completed"
          echo "Backend: FlashInfer"
          echo "vLLM Version: V1"
          echo "Check the logs above for results"
