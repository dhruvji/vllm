name: Latency Benchmark (Eager)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  latency-benchmark-eager:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GPU_TYPE: "H200"
      GPU_COUNT: "1"
      TPOT_THRESHOLD_MS: "10.0"
      VLLM_PRECOMPILED_WHEEL_COMMIT: "a97954b6a8fa41a162ebf58f80a1460a98e0baf0"
      BRANCH: ${{ github.head_ref || github.ref_name }}
      COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal CLI
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Run latency benchmark (eager)
        run: |
          modal run --env=ci .github/scripts/modal_ci_benchmark.py \
            --config-paths .github/benchmark_configs/base_latency_eager.json \
            --config-paths .github/benchmark_configs/prefix_latency_eager.json

      - name: Report results
        if: always()
        run: |
          echo "Latency benchmark (eager) completed"
          echo "Check the logs above for results"
