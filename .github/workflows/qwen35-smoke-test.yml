name: Qwen3.5-0.8B Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qwen35-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GPU_TYPE: "H200"
      GPU_COUNT: "1"
      VLLM_PRECOMPILED_WHEEL_COMMIT: "a97954b6a8fa41a162ebf58f80a1460a98e0baf0"
      BRANCH: ${{ github.head_ref || github.ref_name }}
      COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal CLI
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Run Qwen3.5-0.8B smoke test
        run: |
          modal run --env=ci .github/scripts/modal_ci_pytest.py \
            --test-path tests/models/language/generation/test_qwen35_smoke.py \
            --pytest-args "-v -x"

      - name: Report results
        if: always()
        run: |
          echo "Qwen3.5-0.8B smoke test completed"
          echo "Check the logs above for results"
